<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #ffffff;
      color: #000000;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
    }

    .frame {
      width: 100%;
      max-width: 31.25rem;           
      background: #ffffff;
      padding: 1.5rem 1.5rem 1.75rem;
    }

    .field { margin-bottom: 1.1rem; }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 400;
      margin-bottom: 0.65rem;
    }

    input {
      display: block;
      width: 100%;
      max-width: 22.5rem;          
      height: 1.9rem;
      padding: 0 0.75rem;
      font-family: inherit;
      font-size: 0.8rem;
      color: #000;
      background: #fff;
      border: 1px solid #000;
      border-radius: 0.4rem;
      outline: none;
    }

    input::placeholder { color: #6b6b6b; }

    input:focus { box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.15); }

    .message {
      font-size: 0.8rem;
      margin-top: 0.65rem;
      line-height: 1.3;
    }
    .message:empty { display: none; }
    .message.error   { color: #ff0000; }
    .message.success { color: #1a9f3b; }

    button {
      display: block;
      width: 8rem;                  
      height: 1.75rem;
      margin-top: 1.4rem;
      font-family: inherit;
      font-size: 0.8rem;
      color: #000;
      background: #fff;
      border: 1px solid #000;
      border-radius: 0.4rem;
      cursor: pointer;
    }
    button:hover  { background: #f2f2f2; }
    button:active { background: #e6e6e6; }

    @media (max-width: 768px) {
      body { padding: 1.5rem 0.75rem; }
    }

    @media (max-width: 480px) {
      body { padding: 1rem 0.5rem; }
      .frame { padding: 1rem; }
      input { max-width: 100%; height: 2.5rem; font-size: 1rem; }
      button { width: 100%; height: 2.5rem; font-size: 1rem; }
      label { font-size: 1rem; }
      .message { font-size: 0.875rem; }
    }

    @media (max-width: 320px) {
      html { font-size: 14px; }
    }

    @media (min-width: 1200px) {
      body { padding-top: 4rem; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <form id="signupForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Example@email.com" autocomplete="email" />
        <p class="message" id="emailMsg" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your Password" autocomplete="new-password" />
        <p class="message" id="passwordMsg" aria-live="polite"></p>
      </div>

      <button type="submit" id="submitBtn">Submit</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
